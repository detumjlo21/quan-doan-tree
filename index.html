<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sơ Đồ Tổ Chức PHOENIX 禄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="logo-quant-doan.jpg" alt="Logo PHOENIX">
    <div class="brand-copy"><b>PHOENIX</b><span>THÔNG TIN QUÂN ĐOÀN</span></div>
  </div>
</header>

<main id="org">
  <section class="org-tree" aria-label="Sơ đồ tổ chức">
    <div class="root-wrap"><div class="root-card"><img class="root-logo" src="logo-quant-doan.jpg" alt="PHOENIX"></div></div>
    <div class="tree-line" aria-hidden="true"></div>
    <div id="branches" class="branches"></div>
  </section>
</main>

<div class="admin-footer"><button id="adminBtn" class="admin-btn">▣ &nbsp;Đăng nhập Admin</button></div>

<div id="modal" class="modal hidden">
  <div class="panel">
    <div class="panelhead"><div><small>ADMIN</small><h2>Quản lý PHOENIX</h2></div><button id="close">✕</button></div>
    <div id="loginBox">
      <p>Đăng nhập tài khoản Admin Supabase.</p>
      <input id="email" type="email" placeholder="Email Admin"><input id="password" type="password" placeholder="Mật khẩu">
      <button class="primary" id="login">ĐĂNG NHẬP</button><div id="loginMsg" class="msg"></div>
    </div>
    <div id="adminBox" class="hidden">
      <div class="settings"><label>Tên Quân Đoàn<input id="qdanInput"></label><label>Link liên hệ FB<input id="supportLinkInput" placeholder="https://facebook.com/..." type="url"></label><label>Tên nút liên hệ<input id="supportLabelInput" value="LIÊN HỆ FB"></label><label>Ảnh liên hệ (URL)<input id="supportImageInput" placeholder="https://.../avatar.jpg" type="url"></label></div>
      <div class="section"><b>DANH SÁCH NHÁNH</b><button class="add" id="add">＋ THÊM NHÁNH</button></div>
      <div id="editList"></div>
      <div class="section chat-admin-title"><b>HỆ THỐNG BOX CHAT</b><button class="add" id="addChat">＋ THÊM BOX</button></div>
      <p class="admin-note">Bạn có thể thêm bao nhiêu Box tùy ý. Mỗi Box có tên, nội dung phụ, link tham gia và ảnh riêng.</p>
      <div id="chatEditList"></div>
      <div class="actions"><button class="secondary" id="logout">Đăng xuất</button><button class="primary" id="save">💾 LƯU TẤT CẢ</button></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
