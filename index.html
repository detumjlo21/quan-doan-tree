<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THÔNG TIN QUÂN ĐOÀN PHOENIX 禄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="logo-quant-doan.jpg" alt="Logo PHOENIX">
    <div class="brand-copy"><b>PHOENIX</b><span>THÔNG TIN QUÂN ĐOÀN</span></div>
  </div>
  <nav class="nav">
    <a href="#home">⌂ <span>Trang chủ</span></a>
    <a class="active" href="#org">♟ <span>Cây chức vụ</span></a>
    <a href="#members">♟ <span>Thành viên</span></a>
    <a href="#about">● <span>Giới thiệu</span></a>
  </nav>
  <button id="adminBtn" class="admin-btn">▣ &nbsp;Đăng nhập Admin</button>
</header>

<main id="org">
  <section class="hero" id="home">
    <div class="hero-copy">
      <h1>Sở ĐỒ Tổ Chức Các Nhánh Thuộc PHOENIX 禄</h1>
      
    </div>
  </section>

  <section class="org-tree" aria-label="Sơ đồ tổ chức">
    <div class="root-wrap">
      <div class="root-card" aria-label="Logo quân đoàn tổng">
        <img class="root-logo" src="logo-quant-doan.jpg" alt="PHOENIX">
      </div>
    </div>
    <div class="tree-line" aria-hidden="true"></div>
    <div id="branches" class="branches"></div>
  </section>
</main>

<section id="members" class="placeholder-section"><h2>THÀNH VIÊN</h2><p>Danh sách thành viên sẽ được tích hợp tại đây.</p></section>
<section id="about" class="placeholder-section"><h2>GIỚI THIỆU</h2><p>Thông tin về PHOENIX.</p></section>

<div id="modal" class="modal hidden">
  <div class="panel">
    <div class="panelhead">
      <div><small>ADMIN</small><h2>Quản lý cây chức vụ</h2></div>
      <button id="close">✕</button>
    </div>
    <div id="loginBox">
      <p>Đăng nhập tài khoản Admin Supabase.</p>
      <input id="email" type="email" placeholder="Email Admin">
      <input id="password" type="password" placeholder="Mật khẩu">
      <button class="primary" id="login">ĐĂNG NHẬP</button>
      <div id="loginMsg" class="msg"></div>
    </div>
    <div id="adminBox" class="hidden">
      <div class="settings"><label>Tên Quân Đoàn<input id="qdanInput"></label></div>
      <div class="section"><b>DANH SÁCH NHÁNH</b><button class="add" id="add">＋ THÊM NHÁNH</button></div>
      <div id="editList"></div>
      <div class="actions"><button class="secondary" id="logout">Đăng xuất</button><button class="primary" id="save">💾 LƯU</button></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
